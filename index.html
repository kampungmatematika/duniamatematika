<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dunia Matematika 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html,body{height:100%;margin:0;background:#6f9a7e;font-family:Georgia,"Times New Roman",serif;overflow:hidden;color:#2a2418}
canvas{display:block;touch-action:none}button,select,input{font:inherit}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0000,#0a2a1099);z-index:9}
.card{background:#fbf6e6ee;border:3px solid #6b5a3c;border-radius:6px 22px 6px 22px;padding:22px;width:min(360px,90vw);box-shadow:0 10px 30px #0008}
.card h1{margin:0 0 4px;font-size:26px;color:#2f5a1f}.card p{margin:0 0 12px;font-size:14px}
label{display:block;font-size:13px;margin:10px 0 3px}
.card input,.card select{width:100%;padding:9px;border:2px solid #6b5a3c;border-radius:8px;background:#fff;box-sizing:border-box}
.b{background:#3b6b3f;color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;margin:3px 3px 0 0}
.b:hover{background:#2f5a33}.b.o{background:#8a5a1f}.b.g{background:#6b6b6b}#start{width:100%;margin-top:16px;font-size:17px}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;background:#fbf6e6e6;border:2px solid #6b5a3c;border-radius:10px;padding:6px 10px;font-size:13px;z-index:3;display:none}
#sub{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);max-width:min(560px,92vw);background:#000b;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:10;display:none;text-align:center}
#en{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);transform:translateX(-50%);z-index:4;display:none;font-size:16px}
#pad{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:3;display:none;grid-template-columns:repeat(3,52px);gap:4px}
#pad button{height:52px;border-radius:12px;border:2px solid #fff;background:#0006;color:#fff;font-size:22px;touch-action:none}
#panel{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);width:min(430px,calc(100vw - 16px));max-height:56vh;overflow:auto;background:#fbf6e6f5;border:3px solid #6b5a3c;border-radius:6px 20px 6px 20px;padding:14px;z-index:5;display:none;box-sizing:border-box}
#panel h2{margin:0 0 8px;font-size:19px;color:#2f5a1f}#panel .t{display:flex;flex-wrap:wrap;margin-bottom:8px}
#panel .opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #b9a06a;border-radius:8px;padding:9px;margin:5px 0;cursor:pointer}
#panel .opt:hover{background:#f1e7c6}.ok{background:#bdecb6!important}.no{background:#f6b9b9!important}
#panel input{padding:8px;border:2px solid #b9a06a;border-radius:8px;width:120px}#panel .m{line-height:1.55;font-size:15px}
@media (min-width:700px){#pad{display:none!important}}
</style></head><body>
<div class="ov" id="ov"><div class="card"><h1>Benua Matematika</h1><p>Jelajahi hutan belantara dan lima kastil tua pengetahuan.</p>
<label>Nama pemain</label><input id="nm" maxlength="14" placeholder="Tulis namamu">
<label>Pemain</label><select id="gd"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select>
<label>Kelas (menentukan tingkat soal)</label><select id="kl"><option value="7">Kelas 7</option><option value="8">Kelas 8</option><option value="9">Kelas 9</option></select>
<button class="b" id="start">Masuk ke hutan</button></div></div>
<div id="hud"></div><div id="sub"></div><button class="b o" id="en"></button>
<div id="pad"><span></span><button data-k="u">▲</button><span></span><button data-k="l">◀</button><button data-k="d">▼</button><button data-k="r">▶</button></div>
<div id="panel"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,f=x=>x<0?"("+x+")":x,sh=a=>a.sort(()=>Math.random()-.5),pk=a=>a[R(0,a.length-1)],fr=x=>String(x).replace(".",",");
let mode="login",cls,gen,nm,ti=0,tabN="m",stars=[0,0,0,0,0],area=0,hs=[0,0,0,0,0,0],SK="",ps=[0,0,0,0,0,0],yaw=Math.PI,muted=false,Q,G,near=null,keys={},told={};
const K=()=>+cls-6,sm=a=>a.reduce((x,y)=>x+y,0);
// ===== DATA: 5 BENUA =====
const D=[
{n:"Kastil Bilangan",m:"Benua paling dasar.<br><b>Bilangan bulat:</b> a − b = a + (−b).<br><b>Pecahan:</b> penyebut sama, jumlahkan pembilang.<br><b>Operasi campuran:</b> kurung, kali/bagi, lalu tambah/kurang.<br><b>FPB dan KPK:</b> FPB × KPK = a × b.<br><i>Selesaikan quiz di sini untuk membuka Kastil Peluang dan Statistika.</i>",
g:()=>{const m=3*K()+6;return pk([()=>{let a=R(-m,m),b=R(-m,m),c=R(1,9);return[`${f(a)} + ${f(b)} − ${c} = ?`,a+b-c]},
()=>{let d=pk([2,4,5,10]),a=R(1,d-1),b=R(1,d-1);return[`${a}/${d} + ${b}/${d} = ? (desimal)`,+((a+b)/d).toFixed(2)]},
()=>{let a=R(2,20),b=R(2,9),c=R(2,9),d=R(1,10);return[`${a} + ${b} × ${c} − ${d} = ?`,a+b*c-d]},
()=>{let g=R(2,6),[p,q]=pk([[2,3],[3,4],[2,5],[3,5]]);return R(0,1)?[`KPK dari ${g*p} dan ${g*q} = ?`,g*p*q]:[`FPB dari ${g*p} dan ${g*q} = ?`,g]}])()}},
{n:"Kastil Aljabar",m:"Huruf mewakili bilangan yang belum diketahui.<br><b>Suku sejenis:</b> 3x + 2x = 5x.<br><b>Substitusi:</b> x = 3 pada 2x + 1 menghasilkan 7.<br><b>Persamaan linear:</b> 2x + 3 = 11, maka 2x = 8, sehingga x = 4.",
g:()=>{const k=K();return pk([()=>{let a=R(2,5),x=R(1,4+3*k),b=R(1,9);return[`Selesaikan ${a}x + ${b} = ${a*x+b}. Nilai x = ?`,x]},
()=>{let a=R(2,6),b=R(1,9),x=R(2,3+2*k);return[`Jika x = ${x}, nilai ${a}x + ${b} = ?`,a*x+b]},
()=>{let a=R(2,9),b=R(2,9);return[`Sederhanakan ${a}x + ${b}x. Berapa koefisien x?`,a+b]}])()}},
{n:"Kastil Geometri",m:"Mempelajari bentuk, ukuran, dan ruang.<br><b>Persegi panjang:</b> L = p × l, K = 2(p + l).<br><b>Kubus:</b> V = s³, L = 6s².<br><b>Tabung:</b> V = πr²t dengan π = 22/7.<br>Soal menyesuaikan kelasmu.",
g:()=>{const k=K();if(k==1){let p=R(3,12),l=R(2,8);return R(0,1)?[`Persegi panjang ${p}×${l} cm. Luas?`,p*l]:[`Persegi panjang ${p}×${l} cm. Keliling?`,2*(p+l)]}
if(k==2){let s=R(2,9);return R(0,1)?[`Kubus rusuk ${s} cm. Volume?`,s**3]:[`Kubus rusuk ${s} cm. Luas permukaan?`,6*s*s]}
let r=pk([7,14]),t=R(2,9);return[`Tabung r = ${r} cm, t = ${t} cm (π = 22/7). Volume?`,22*(r/7)*r*t]}},
{n:"Kastil Peluang",m:"Peluang = kejadian yang diinginkan : semua kejadian.<br>Dadu 6 sisi: peluang angka 4 = 1/6.<br>Melempar n koin menghasilkan 2ⁿ hasil berbeda.<br>Nilai peluang selalu antara 0 dan 1.",
g:()=>pk([()=>{let T=pk([4,5,10,20]),a=R(1,T-1);return[`Kantong berisi ${a} bola merah dan ${T-a} bola biru. Peluang terambil merah? (desimal)`,+(a/T).toFixed(2)]},
()=>{let n=R(2,3+K());return[`Berapa banyak hasil berbeda dari melempar ${n} koin sekaligus?`,2**n]},
()=>{let n=R(1,5);return[`Satu dadu dilempar. Peluang mata dadu ≤ ${n}? (desimal, 2 angka)`,+(n/6).toFixed(2)]}])()},
{n:"Kastil Statistika",m:"Mengolah dan menafsirkan data.<br><b>Rata-rata</b> = jumlah data : banyak data.<br><b>Median</b> = nilai tengah data terurut.<br><b>Modus</b> = nilai yang paling sering muncul.<br>Contoh 2, 3, 3, 4, 8: rata-rata 4, median 3, modus 3.",
g:()=>{const m=4+3*K();let a=Array.from({length:4},()=>R(2,m*2));a.push((5-sm(a)%5)%5+5*R(1,3));return pk([()=>[`Rata-rata dari ${a.join(", ")} = ?`,sm(a)/5],
()=>[`Median dari ${a.join(", ")} = ?`,[...a].sort((x,y)=>x-y)[2]],
()=>{let o=R(2,20);return[`Modus dari ${sh([o,o,R(21,30),R(31,40),R(41,50)]).join(", ")} = ?`,o]}])()}}];

const vid=v=>`<p><a class="b" style="display:inline-block;text-decoration:none" href="https://www.youtube.com/watch?v=${v}" target="_blank" rel="noopener">▶ Buka video di YouTube</a><button class="b o" onclick="pv('${v}')">Putar di sini</button></p><div id="vf"></div>`;
function pv(v){$("vf").innerHTML=`<iframe width="100%" height="220" src="https://www.youtube-nocookie.com/embed/${v}" allowfullscreen style="border:0;border-radius:8px"></iframe><p style="font-size:12px">Jika layar kosong, pakai tombol Buka video di YouTube.</p>`}
function zm(u){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:#000d;z-index:20;overflow:auto;text-align:center;cursor:zoom-out";d.innerHTML=`<img src="${u||IMG}" style="width:min(900px,100%)">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
const D3=[
{n:"Perbandingan Bilangan Bulat",v:"W2QXh4ws5RY",m:`<img src="${IMG2}" alt="Kaidah Membandingkan Bilangan Bulat" style="width:100%;border-radius:8px;cursor:zoom-in" onclick="zm(IMG2)"><p style="font-size:12px;margin:4px 0">Ketuk gambar untuk memperbesar.</p>`,
g:()=>{const m=6+4*K(),L=()=>Array.from({length:4},()=>R(-m,m));return pk([()=>{let l=L();return[`Bilangan terbesar di antara ${l.join(", ")} adalah ...`,Math.max(...l)]},()=>{let l=L();return[`Bilangan terkecil di antara ${l.join(", ")} adalah ...`,Math.min(...l)]},()=>{let a=R(-m,0),b=R(1,m);return[`Berapa banyak bilangan bulat di antara ${a} dan ${b}?`,b-a-1]},()=>{let a=R(-m,m),b=R(-m,m);return[`Jarak ${f(a)} ke ${f(b)} pada garis bilangan adalah ...`,Math.abs(a-b)]}])()}},
{n:"Pengurutan Bilangan Bulat",m:`<img src="${IMG3}" alt="Pengurutan Bilangan Bulat" style="width:100%;border-radius:8px;cursor:zoom-in" onclick="zm(IMG3)"><p style="font-size:12px;margin:4px 0">Ketuk gambar untuk memperbesar.</p>`,
g:()=>{const m=6+4*K(),u=new Set();while(u.size<5)u.add(R(-m,m));const l=sh([...u]),asc=R(0,1),k=R(1,5),q=[...l].sort((a,b)=>asc?a-b:b-a);return[`Urutkan ${asc?"dari terkecil":"dari terbesar"}: ${l.join(", ")}. Bilangan urutan ke-${k} adalah ...`,q[k-1]]}},
{n:"Operasi Bilangan Bulat",m:"Penjumlahan: tanda sama, jumlahkan; tanda beda, kurangkan. a − b = a + (−b).<br>Perkalian dan pembagian: tanda sama hasilnya positif, tanda beda hasilnya negatif.<br>Contoh: (−6) × 4 = −24 dan (−20) : (−5) = 4.",
g:()=>{const m=8+4*K();return pk([()=>{let a=R(-m,m),b=R(-m,m);return[`${f(a)} + ${f(b)} = ?`,a+b]},()=>{let a=R(-m,m),b=R(-m,m);return[`${f(a)} − ${f(b)} = ?`,a-b]},()=>{let a=R(-9,9),b=R(-9,9);return[`${f(a)} × ${f(b)} = ?`,a*b]},()=>{let b=pk([-9,-8,-7,-6,-5,-4,-3,-2,2,3,4,5,6,7,8,9]),c=R(-9,9);return[`${f(b*c)} ÷ ${f(b)} = ?`,c]},()=>{let a=R(-9,9),b=R(-9,9),c=R(-9,9);return[`${f(a)} + ${f(b)} × ${f(c)} = ?`,a+b*c]}])()}},
